{{ define "header" }}
  {{ partials.Include "page-header.html" . }}
{{ end }}

{{ define "main" }}
  {{ $widthClass := .Params.content_width | compare.Default "content-width" }}
  <article class="page-body {{ $widthClass }}">
    <div class="page-body__content nested-links">
      {{- .Content -}}
    </div>
  </article>
{{ end }}
