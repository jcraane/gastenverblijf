<div class="split{{ if .Get "reverse" }} split--reverse{{ end }}">
    <div class="split__media">
        {{ partial "img.html" (dict "src" (.Get "img") "alt" (.Get "alt") "sizes" "(min-width: 60em) 31rem, 100vw" "class" "split__img") }}
    </div>
    <div class="split__body">
        {{ .Inner | markdownify }}
    </div>
</div>
