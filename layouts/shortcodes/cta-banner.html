<div class="cta-banner">
    {{ with .Get "title" }}<h3 class="cta-banner__title">{{ . }}</h3>{{ end }}
    {{ with .Get "text" }}<p class="cta-banner__text">{{ . }}</p>{{ end }}
    <div class="cta-banner__buttons">
    {{ with .Get "button_link" }}
    <a href="{{ . }}" class="btn btn--primary" data-goatcounter-click="cta-banner-{{ . | strings.TrimPrefix "/" | strings.TrimSuffix "/" }}" data-goatcounter-referrer="{{ $.Page.RelPermalink }}">
        {{ $.Get "button_text" | default "Meer informatie" }}
    </a>
    {{ end }}
    {{ with .Get "button2_link" }}
    <a href="{{ . }}" class="btn btn--outline" data-goatcounter-click="cta-banner-{{ . | strings.TrimPrefix "/" | strings.TrimSuffix "/" }}" data-goatcounter-referrer="{{ $.Page.RelPermalink }}">
        {{ $.Get "button2_text" | default "Meer informatie" }}
    </a>
    {{ end }}
    </div>
</div>
