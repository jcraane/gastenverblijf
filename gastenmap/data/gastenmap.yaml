# Content of the printed guest folder. Text fields are Markdown.
# [[...]] marks something still to be filled in; it prints highlighted, so it can't be missed.
# The wifi details and phone number are in private.yaml (gitignored, the repo is public).

cover:
  img: /images/verblijf/zithoek_1.jpg
  position: center 60%

contact:
  names: Jamie & Ingrid
  email: info@puurgelukberghem.nl
  address: Penningkruid 21, 5351 KA Berghem
  website: https://puurgelukberghem.nl/

welkom: |
  Fijn dat u er bent! In deze map vindt u alles voor een ontspannen verblijf:
  praktische informatie, de huisregels en tips om de omgeving te ontdekken.

  Mist u iets, gaat er iets stuk of heeft u een vraag? Laat het ons gerust weten,
  dan lossen we het graag voor u op.

  Wij wensen u een heerlijk verblijf.

tijden:
  - label: Inchecken
    value: 15:00 – 17:00
  - label: Uitchecken
    value: vóór 10:30
  - label: Stilte
    value: 22:00 – 07:00

huisregels:
  - Het is stil tussen 22:00 en 07:00. Zo geniet iedereen van de rust.
  - Wilt u iemand extra laten overnachten? Overleg dit eerst met ons.
  - Roken is binnen niet toegestaan, op het terras wel.
  - Open vuur en kaarsen zijn niet toegestaan.
  - Huisdieren zijn helaas niet toegestaan.
  - Is er iets kapot? Meld het ons direct, dan kunnen we het oplossen.

# "Hoe werkt het" page: one block per topic.
