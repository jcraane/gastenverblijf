    title: Airco
    text: "[[Bediening van de airco: afstandsbediening, verwarmen/koelen, uitzetten bij vertrek.]]"
  - icon: flame
    title: Verwarming
    text: "[[Hoe de verwarming werkt, ook in de badkamer.]]"
  - icon: coffee
    title: Nespresso & thee
    text: "[[Hoe de Nespresso werkt, waar cups en thee staan.]]"
  - icon: tv
    title: Televisie
    text: "[[Welke afstandsbediening, zenders, apps (Netflix e.d.).]]"
  - icon: pot
