vertrek:
  intro: Uitchecken kan tot 10:30. Wilt u voor vertrek even het volgende nalopen?
  items:
    - Vaat schoon en terug in de kast
    - Koelkast leeg
    - Vuilniszak buiten naast de voordeur gezet
    - Airco en lichten uit, ventilatie op stand 1
    - Ramen en deuren dicht
    - Sleutel bij ons afgegeven (stuur even een appje), tenzij we iets anders hebben afgesproken
    - Uitgelogd bij Netflix en andere streamingdiensten op de tv
    - Niets vergeten? Denk aan opladers en de koelkast
  outro: Bedankt voor uw verblijf en graag tot ziens!
