# Content of the printed guest folder. Text fields are Markdown.
# [[...]] marks something still to be filled in; it prints highlighted, so it can't be missed.
# The wifi details and phone number are in private.yaml (gitignored, the repo is public).

cover:
  img: /images/verblijf/zithoek_1.jpg
  position: center 60%

contact:
  names: Jamie & Ingrid
  email: info@puurgelukberghem.nl
  address: Penningkruid 21, 5351 KA Berghem
  website: https://puurgelukberghem.nl/

welkom: |
  Fijn dat u er bent! In deze map vindt u alles voor een ontspannen verblijf:
  praktische informatie, de huisregels en tips om de omgeving te ontdekken.

  Mist u iets, gaat er iets stuk of heeft u een vraag? Laat het ons gerust weten,
  dan lossen we het graag voor u op.

  Wij wensen u een heerlijk verblijf.

tijden:
  - label: Inchecken
    value: 15:00 – 17:00
  - label: Uitchecken
    value: vóór 10:30
  - label: Stilte
    value: 22:00 – 07:00

huisregels:
  - Het is stil tussen 22:00 en 07:00. Zo geniet iedereen van de rust.
  - Wilt u iemand extra laten overnachten? Overleg dit eerst met ons.
  - Roken is binnen niet toegestaan, op het terras wel.
  - Open vuur en kaarsen zijn niet toegestaan.
  - Huisdieren zijn helaas niet toegestaan.
  - Neem de sleutel altijd mee als u naar buiten gaat en laat hem niet binnen in het slot zitten, anders krijgt u de deur niet meer open.
  - Is er iets kapot? Meld het ons direct, dan kunnen we het oplossen.

# "Hoe werkt het" page: one block per topic.
hoe_werkt_het:
  - icon: flame
    title: Verwarmen en koelen
    text: Verwarmen doet u met de thermostaat, koelen met de airco. Hoe ze werken, staat bij **Apparaten** op de volgende pagina's, net als de ventilatie, de magnetron en de sfeerverlichting.
  - icon: tv
    title: Televisie
    text: Samsung smart-tv. Kijk met uw eigen account bij Netflix, Disney+ of andere diensten; inloggen gaat meestal met een code of QR-code via uw telefoon. **Log bij vertrek weer uit**, anders kijkt de volgende gast op uw account. Zonder account kunt u Samsung TV Plus, YouTube en NPO Start gebruiken.
  - icon: pot
    title: Keuken
    text: Inductiekookplaat met afzuiging, combimagnetron/oven, koelkast, waterkoker en broodrooster.
  - icon: trash
    title: Afval
    text: Zet volle vuilniszakken buiten naast de voordeur.
  - icon: car
    title: Parkeren
    text: U parkeert gratis op de eigen inrit bij het gastenverblijf.
  - icon: light
    title: Terras
    text: "[[Sfeerverlichting op het terras aan- en uitzetten.]]"

