{{/* gm-qr — QR code (generated by Hugo, no external service). Params: text (required), alt, class */}}
{{- with images.QR .text (dict "level" "medium" "scale" 8) -}}
<img class="qr {{ $.class }}" src="{{ .RelPermalink }}" width="{{ .Width }}" height="{{ .Height }}" alt="{{ $.alt | default "QR-code" }}">
{{- end -}}
